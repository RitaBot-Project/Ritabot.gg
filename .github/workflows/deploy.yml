name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter @workspace/ritabot-homepage run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production
          VITE_API_BASE_URL: https://rita-bot-home-api-server.vercel.app
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/ritabot-homepage/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
